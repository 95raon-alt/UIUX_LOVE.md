<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  background-color: #FAF6EB;
  color: #4C4E52;
  -webkit-font-smoothing: antialiased;
  padding: 32px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.slide-canvas {
  width: 1200px;
  background: #FFFFFF;
  border-radius: 24px;
  border: 1px solid rgba(76, 78, 82, 0.15);
  box-shadow: 0 10px 30px -4px rgba(24, 61, 51, 0.05);
  padding: 44px 48px;
  position: relative;
  overflow: hidden;
}
.slide-header {
  margin-bottom: 28px;
}
.slide-title {
  font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
  font-size: 30px;
  font-weight: 800;
  color: #183D33;
  letter-spacing: -0.025em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.slide-desc {
  font-size: 14.5px;
  color: #7A7D84;
  line-height: 1.55;
  font-weight: 400;
}
.slide-meta {
  font-family: 'Inter', 'Pretendard', sans-serif;
  font-size: 11.5px;
  color: #183D33;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 24px;
  background: #EAF4EE;
  padding: 6px 14px;
  border-radius: 9999px;
  display: inline-block;
  border: 1px solid rgba(118, 165, 140, 0.3);
}
.grid-box {
  background: #FAF6EB;
  border-radius: 18px;
  border: 1px solid rgba(76, 78, 82, 0.12);
  padding: 28px;
}
</style>
</head>
<body>

<div class="slide-canvas">
  <div class="slide-header">
    <h2 class="slide-title">Badge</h2>
    <p class="slide-desc">학습 상태 &middot; 난이도 &middot; 분류 정보를 짧게 표시합니다. Size 2종 &times; Tone 5종으로 총 10개 Variants를 제공합니다.</p>
    <div class="slide-meta">PROPERTY Label &middot; VARIANTS Size / Tone &middot; 짧은 명사형 문구 사용</div>
  </div>

  <div class="grid-box">
    <div style="display: flex; flex-direction: column; gap: 20px; align-items: flex-start;">
      <!-- Small Badges (24px) -->
      <div style="display: flex; gap: 16px; align-items: center;">
        <span style="height: 24px; padding: 0 12px; border-radius: 9999px; background: #FAF6EB; color: #4C4E52; border: 1px solid rgba(76,78,82,0.2); font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center;">상태 (Charcoal)</span>
        <span style="height: 24px; padding: 0 12px; border-radius: 9999px; background: #EAF4EE; color: #183D33; border: 1px solid #76A58C; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center;">상태 (Deep Green)</span>
        <span style="height: 24px; padding: 0 12px; border-radius: 9999px; background: #76A58C; color: #FFFFFF; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center;">상태 (Sage)</span>
        <span style="height: 24px; padding: 0 12px; border-radius: 9999px; background: #FAF0EB; color: #503323; border: 1px solid rgba(80,51,35,0.3); font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center;">상태 (Walnut)</span>
        <span style="height: 24px; padding: 0 12px; border-radius: 9999px; background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center;">상태 (Danger)</span>
      </div>

      <!-- Medium Badges (28px) -->
      <div style="display: flex; gap: 16px; align-items: center;">
        <span style="height: 28px; padding: 0 16px; border-radius: 9999px; background: #FAF6EB; color: #4C4E52; border: 1px solid rgba(76,78,82,0.2); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center;">상태 (Charcoal)</span>
        <span style="height: 28px; padding: 0 16px; border-radius: 9999px; background: #EAF4EE; color: #183D33; border: 1px solid #76A58C; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center;">상태 (Deep Green)</span>
        <span style="height: 28px; padding: 0 16px; border-radius: 9999px; background: #76A58C; color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center;">상태 (Sage)</span>
        <span style="height: 28px; padding: 0 16px; border-radius: 9999px; background: #FAF0EB; color: #503323; border: 1px solid rgba(80,51,35,0.3); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center;">상태 (Walnut)</span>
        <span style="height: 28px; padding: 0 16px; border-radius: 9999px; background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center;">상태 (Danger)</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
