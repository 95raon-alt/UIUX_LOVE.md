<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  background-color: #FAF6EB;
  color: #4C4E52;
  -webkit-font-smoothing: antialiased;
  padding: 32px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.slide-canvas {
  width: 1200px;
  background: #FFFFFF;
  border-radius: 24px;
  border: 1px solid rgba(76, 78, 82, 0.15);
  box-shadow: 0 10px 30px -4px rgba(24, 61, 51, 0.05);
  padding: 44px 48px;
  position: relative;
  overflow: hidden;
}
.slide-header {
  margin-bottom: 28px;
}
.slide-title {
  font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
  font-size: 30px;
  font-weight: 800;
  color: #183D33;
  letter-spacing: -0.025em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.slide-desc {
  font-size: 14.5px;
  color: #7A7D84;
  line-height: 1.55;
  font-weight: 400;
}
.slide-meta {
  font-family: 'Inter', 'Pretendard', sans-serif;
  font-size: 11.5px;
  color: #183D33;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 24px;
  background: #EAF4EE;
  padding: 6px 14px;
  border-radius: 9999px;
  display: inline-block;
  border: 1px solid rgba(118, 165, 140, 0.3);
}
.grid-box {
  background: #FAF6EB;
  border-radius: 18px;
  border: 1px solid rgba(76, 78, 82, 0.12);
  padding: 28px;
}
</style>
</head>
<body>

<div class="slide-canvas">
  <div class="slide-header">
    <h2 class="slide-title">Quiz Option</h2>
    <p class="slide-desc">객관식 답안 선택, 채점, 복습 상태를 하나의 컴포넌트로 관리합니다.</p>
    <div class="slide-meta">8 states &middot; Prefix/Label 편집 가능 &middot; 최소 높이 64px &middot; Focus 2px</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <!-- 1. Default -->
    <div style="min-height: 64px; background: #FFFFFF; border: 1.5px solid rgba(76,78,82,0.15); border-radius: 14px; padding: 14px 24px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #FAF6EB; border: 1px solid rgba(76,78,82,0.25); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13.5px; color: #4C4E52;">A</div>
      <div style="font-size: 15px; color: #4C4E52; font-weight: 500;">선택지 내용을 입력하세요</div>
    </div>

    <!-- 2. Hover -->
    <div style="min-height: 64px; background: #FAF6EB; border: 1.5px solid #76A58C; border-radius: 14px; padding: 14px 24px; display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 12px rgba(24, 61, 51, 0.08);">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #EAF4EE; border: 1.5px solid #76A58C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13.5px; color: #183D33;">A</div>
      <div style="font-size: 15px; color: #183D33; font-weight: 600;">선택지 내용을 입력하세요</div>
    </div>

    <!-- 3. Selected (Outline) -->
    <div style="min-height: 64px; background: #FFFFFF; border: 2px solid #183D33; border-radius: 14px; padding: 14px 24px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #183D33; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13.5px; color: #FAF6EB;">A</div>
      <div style="font-size: 15px; color: #183D33; font-weight: 700;">선택지 내용을 입력하세요</div>
    </div>

    <!-- 4. Selected (Filled) -->
    <div style="min-height: 64px; background: #EAF4EE; border: 1.5px solid #76A58C; border-radius: 14px; padding: 14px 24px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #183D33; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13.5px; color: #FAF6EB;">A</div>
      <div style="font-size: 15px; color: #183D33; font-weight: 600;">선택지 내용을 입력하세요</div>
    </div>

    <!-- 5. Correct -->
    <div style="min-height: 64px; background: #ECFDF5; border: 1.5px solid #10B981; border-radius: 14px; padding: 14px 24px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #10B981; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13.5px; color: #FFFFFF;">A</div>
      <div style="font-size: 15px; color: #065F46; font-weight: 600;">선택지 내용을 입력하세요</div>
    </div>

    <!-- 6. Incorrect -->
    <div style="min-height: 64px; background: #FEF2F2; border: 1.5px solid #EF4444; border-radius: 14px; padding: 14px 24px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #EF4444; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13.5px; color: #FFFFFF;">A</div>
      <div style="font-size: 15px; color: #991B1B; font-weight: 600;">선택지 내용을 입력하세요</div>
    </div>

    <!-- 7. Disabled -->
    <div style="min-height: 64px; background: #F4EFE2; border: 1.5px solid rgba(76,78,82,0.1); border-radius: 14px; padding: 14px 24px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #E2D9C8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13.5px; color: #83878E;">A</div>
      <div style="font-size: 15px; color: #83878E; font-weight: 500;">선택지 내용을 입력하세요</div>
    </div>

    <!-- 8. Review -->
    <div style="min-height: 64px; background: #FAF0EB; border: 1.5px solid #503323; border-radius: 14px; padding: 14px 24px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #503323; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13.5px; color: #FAF6EB;">A</div>
      <div style="font-size: 15px; color: #503323; font-weight: 600;">선택지 내용을 입력하세요</div>
    </div>
  </div>
</div>
</body>
</html>
