<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  background-color: #FAF6EB;
  color: #4C4E52;
  -webkit-font-smoothing: antialiased;
  padding: 32px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.slide-canvas {
  width: 1200px;
  background: #FFFFFF;
  border-radius: 24px;
  border: 1px solid rgba(76, 78, 82, 0.15);
  box-shadow: 0 10px 30px -4px rgba(24, 61, 51, 0.05);
  padding: 44px 48px;
  position: relative;
  overflow: hidden;
}
.slide-header {
  margin-bottom: 28px;
}
.slide-title {
  font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
  font-size: 30px;
  font-weight: 800;
  color: #183D33;
  letter-spacing: -0.025em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.slide-desc {
  font-size: 14.5px;
  color: #7A7D84;
  line-height: 1.55;
  font-weight: 400;
}
.slide-meta {
  font-family: 'Inter', 'Pretendard', sans-serif;
  font-size: 11.5px;
  color: #183D33;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 24px;
  background: #EAF4EE;
  padding: 6px 14px;
  border-radius: 9999px;
  display: inline-block;
  border: 1px solid rgba(118, 165, 140, 0.3);
}
.grid-box {
  background: #FAF6EB;
  border-radius: 18px;
  border: 1px solid rgba(76, 78, 82, 0.12);
  padding: 28px;
}
</style>
</head>
<body>

<div class="slide-canvas">
  <div class="slide-header">
    <h2 class="slide-title">Question Number</h2>
    <p class="slide-desc">문제 이동 &middot; 응답 &middot; 채점 상태를 표시합니다. Size 2종 &times; State 6종으로 총 12개 Variants를 제공합니다.</p>
    <div class="slide-meta">PROPERTY Number &middot; VARIANTS Size / State &middot; 최소 40px 터치 영역 유지</div>
  </div>

  <div class="grid-box" style="display: inline-block;">
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <!-- Small (36px) -->
      <div style="display: flex; gap: 16px; align-items: center;">
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid rgba(76,78,82,0.2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #4C4E52;">1</div>
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #183D33; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #FAF6EB; box-shadow: 0 0 12px rgba(24, 61, 51, 0.4);">1</div>
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #EAF4EE; border: 1.5px solid #183D33; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #183D33;">1</div>
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #ECFDF5; border: 1.5px solid #10B981; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #047857;">1</div>
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #FEF2F2; border: 1.5px solid #EF4444; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #B91C1C;">1</div>
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #FAF0EB; border: 1.5px solid #503323; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #503323;">1</div>
      </div>

      <!-- Medium (44px) -->
      <div style="display: flex; gap: 16px; align-items: center;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid rgba(76,78,82,0.2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #4C4E52;">1</div>
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #183D33; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #FAF6EB; box-shadow: 0 0 12px rgba(24, 61, 51, 0.4);">1</div>
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #EAF4EE; border: 1.5px solid #183D33; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #183D33;">1</div>
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #ECFDF5; border: 1.5px solid #10B981; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #047857;">1</div>
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #FEF2F2; border: 1.5px solid #EF4444; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #B91C1C;">1</div>
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #FAF0EB; border: 1.5px solid #503323; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #503323;">1</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
