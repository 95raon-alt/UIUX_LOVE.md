<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  background-color: #FAF6EB;
  color: #4C4E52;
  -webkit-font-smoothing: antialiased;
  padding: 32px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.slide-canvas {
  width: 1200px;
  background: #FFFFFF;
  border-radius: 24px;
  border: 1px solid rgba(76, 78, 82, 0.15);
  box-shadow: 0 10px 30px -4px rgba(24, 61, 51, 0.05);
  padding: 44px 48px;
  position: relative;
  overflow: hidden;
}
.slide-header {
  margin-bottom: 28px;
}
.slide-title {
  font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
  font-size: 30px;
  font-weight: 800;
  color: #183D33;
  letter-spacing: -0.025em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.slide-desc {
  font-size: 14.5px;
  color: #7A7D84;
  line-height: 1.55;
  font-weight: 400;
}
.slide-meta {
  font-family: 'Inter', 'Pretendard', sans-serif;
  font-size: 11.5px;
  color: #183D33;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 24px;
  background: #EAF4EE;
  padding: 6px 14px;
  border-radius: 9999px;
  display: inline-block;
  border: 1px solid rgba(118, 165, 140, 0.3);
}
.grid-box {
  background: #FAF6EB;
  border-radius: 18px;
  border: 1px solid rgba(76, 78, 82, 0.12);
  padding: 28px;
}
</style>
</head>
<body>

<div class="slide-canvas">
  <div class="slide-header">
    <h2 class="slide-title">Progress</h2>
    <p class="slide-desc">학습 &middot; 시험 진행률을 표시합니다. Value 5단계 &times; Tone 2종으로 총 10개 Variants를 제공합니다.</p>
    <div class="slide-meta">VARIANTS Value / Tone &middot; 단계 전환 시 값과 완료 톤을 함께 변경</div>
  </div>

  <div class="grid-box">
    <div style="display: flex; flex-direction: column; gap: 24px;">
      <!-- Row 1: Deep Forest Green (5 values: 0%, 25%, 50%, 75%, 100%) -->
      <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;">
        <div style="height: 10px; background: #E2D9C8; border-radius: 9999px; overflow: hidden;"><div style="width: 0%; height: 100%; background: #183D33;"></div></div>
        <div style="height: 10px; background: #E2D9C8; border-radius: 9999px; overflow: hidden;"><div style="width: 25%; height: 100%; background: #183D33; border-radius: 9999px;"></div></div>
        <div style="height: 10px; background: #E2D9C8; border-radius: 9999px; overflow: hidden;"><div style="width: 50%; height: 100%; background: #183D33; border-radius: 9999px;"></div></div>
        <div style="height: 10px; background: #E2D9C8; border-radius: 9999px; overflow: hidden;"><div style="width: 75%; height: 100%; background: #183D33; border-radius: 9999px;"></div></div>
        <div style="height: 10px; background: #E2D9C8; border-radius: 9999px; overflow: hidden;"><div style="width: 100%; height: 100%; background: #183D33; border-radius: 9999px;"></div></div>
      </div>

      <!-- Row 2: Vital Sage Green (5 values: 0%, 25%, 50%, 75%, 100%) -->
      <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;">
        <div style="height: 10px; background: #E2D9C8; border-radius: 9999px; overflow: hidden;"><div style="width: 0%; height: 100%; background: #76A58C;"></div></div>
        <div style="height: 10px; background: #E2D9C8; border-radius: 9999px; overflow: hidden;"><div style="width: 25%; height: 100%; background: #76A58C; border-radius: 9999px;"></div></div>
        <div style="height: 10px; background: #E2D9C8; border-radius: 9999px; overflow: hidden;"><div style="width: 50%; height: 100%; background: #76A58C; border-radius: 9999px;"></div></div>
        <div style="height: 10px; background: #E2D9C8; border-radius: 9999px; overflow: hidden;"><div style="width: 75%; height: 100%; background: #76A58C; border-radius: 9999px;"></div></div>
        <div style="height: 10px; background: #E2D9C8; border-radius: 9999px; overflow: hidden;"><div style="width: 100%; height: 100%; background: #76A58C; border-radius: 9999px;"></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
