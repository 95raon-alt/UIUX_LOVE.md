<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  background-color: #FAF6EB;
  color: #4C4E52;
  -webkit-font-smoothing: antialiased;
  padding: 32px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.slide-canvas {
  width: 1200px;
  background: #FFFFFF;
  border-radius: 24px;
  border: 1px solid rgba(76, 78, 82, 0.15);
  box-shadow: 0 10px 30px -4px rgba(24, 61, 51, 0.05);
  padding: 44px 48px;
  position: relative;
  overflow: hidden;
}
.slide-header {
  margin-bottom: 28px;
}
.slide-title {
  font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
  font-size: 30px;
  font-weight: 800;
  color: #183D33;
  letter-spacing: -0.025em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.slide-desc {
  font-size: 14.5px;
  color: #7A7D84;
  line-height: 1.55;
  font-weight: 400;
}
.slide-meta {
  font-family: 'Inter', 'Pretendard', sans-serif;
  font-size: 11.5px;
  color: #183D33;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 24px;
  background: #EAF4EE;
  padding: 6px 14px;
  border-radius: 9999px;
  display: inline-block;
  border: 1px solid rgba(118, 165, 140, 0.3);
}
.grid-box {
  background: #FAF6EB;
  border-radius: 18px;
  border: 1px solid rgba(76, 78, 82, 0.12);
  padding: 28px;
}
</style>
</head>
<body>

<div class="slide-canvas">
  <div class="slide-header">
    <h2 class="slide-title">Timer</h2>
    <p class="slide-desc">시험 제한시간과 임박 &middot; 위험 상태를 명확하게 전달합니다.</p>
    <div class="slide-meta">Default &middot; Warning &middot; Danger &middot; Time 편집 가능 &middot; 고정폭 Tabular 숫자</div>
  </div>

  <div style="display: flex; gap: 20px; align-items: center;">
    <!-- Default (Cream White + Deep Forest Green) -->
    <div style="height: 52px; padding: 0 32px; border-radius: 9999px; background: #FFFFFF; border: 1.5px solid rgba(76,78,82,0.15); display: inline-flex; align-items: center; box-shadow: 0 4px 12px rgba(24, 61, 51, 0.05);">
      <span style="font-family: 'Inter', monospace; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; color: #183D33; letter-spacing: 0.04em;">00:24:36</span>
    </div>

    <!-- Warning (Dark Walnut / Amber) -->
    <div style="height: 52px; padding: 0 32px; border-radius: 9999px; background: #FAF0EB; border: 1.5px solid #503323; display: inline-flex; align-items: center; box-shadow: 0 4px 12px rgba(80, 51, 35, 0.1);">
      <span style="font-family: 'Inter', monospace; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; color: #503323; letter-spacing: 0.04em;">00:24:36</span>
    </div>

    <!-- Danger (Coral Red) -->
    <div style="height: 52px; padding: 0 32px; border-radius: 9999px; background: #FEF2F2; border: 1.5px solid #EF4444; display: inline-flex; align-items: center; box-shadow: 0 4px 16px rgba(239, 68, 68, 0.15);">
      <span style="font-family: 'Inter', monospace; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; color: #DC2626; letter-spacing: 0.04em;">00:24:36</span>
    </div>
  </div>
</div>
</body>
</html>
