<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  background-color: #FAF6EB;
  color: #4C4E52;
  -webkit-font-smoothing: antialiased;
  padding: 32px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.slide-canvas {
  width: 1200px;
  background: #FFFFFF;
  border-radius: 24px;
  border: 1px solid rgba(76, 78, 82, 0.15);
  box-shadow: 0 10px 30px -4px rgba(24, 61, 51, 0.05);
  padding: 44px 48px;
  position: relative;
  overflow: hidden;
}
.slide-header {
  margin-bottom: 28px;
}
.slide-title {
  font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
  font-size: 30px;
  font-weight: 800;
  color: #183D33;
  letter-spacing: -0.025em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.slide-desc {
  font-size: 14.5px;
  color: #7A7D84;
  line-height: 1.55;
  font-weight: 400;
}
.slide-meta {
  font-family: 'Inter', 'Pretendard', sans-serif;
  font-size: 11.5px;
  color: #183D33;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 24px;
  background: #EAF4EE;
  padding: 6px 14px;
  border-radius: 9999px;
  display: inline-block;
  border: 1px solid rgba(118, 165, 140, 0.3);
}
.grid-box {
  background: #FAF6EB;
  border-radius: 18px;
  border: 1px solid rgba(76, 78, 82, 0.12);
  padding: 28px;
}
</style>
</head>
<body>

<div class="slide-canvas">
  <div class="slide-header">
    <h2 class="slide-title">Card</h2>
    <p class="slide-desc">대시보드 통계, 해설, 결과 정보를 일관된 표면 위에 구성합니다.</p>
    <div class="slide-meta">Base &middot; Stat &middot; Explanation &middot; Result &middot; Title/Body 편집 가능</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
    <!-- BASIC -->
    <div style="background: #FFFFFF; border: 1.5px solid rgba(76,78,82,0.15); border-radius: 18px; padding: 32px 28px; box-shadow: 0 4px 16px rgba(24, 61, 51, 0.04);">
      <div style="font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; color: #7A7D84; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px;">BASIC</div>
      <h3 style="font-size: 20px; font-weight: 700; color: #183D33; margin-bottom: 8px;">카드 제목</h3>
      <p style="font-size: 14px; color: #4C4E52; line-height: 1.6;">학습 정보를 입력하세요.</p>
    </div>

    <!-- STAT -->
    <div style="background: #FFFFFF; border: 1.5px solid #183D33; border-radius: 18px; padding: 32px 28px; box-shadow: 0 4px 16px rgba(24, 61, 51, 0.08);">
      <div style="font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; color: #183D33; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px;">STAT</div>
      <h3 style="font-size: 20px; font-weight: 700; color: #183D33; margin-bottom: 8px;">카드 제목</h3>
      <p style="font-size: 14px; color: #4C4E52; line-height: 1.6;">학습 정보를 입력하세요.</p>
    </div>

    <!-- EXPLANATION -->
    <div style="background: #FAF6EB; border: 1.5px solid rgba(76,78,82,0.2); border-radius: 18px; padding: 32px 28px;">
      <div style="font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; color: #503323; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px;">EXPLANATION</div>
      <h3 style="font-size: 20px; font-weight: 700; color: #503323; margin-bottom: 8px;">카드 제목</h3>
      <p style="font-size: 14px; color: #4C4E52; line-height: 1.6;">학습 정보를 입력하세요.</p>
    </div>

    <!-- RESULT -->
    <div style="background: #EAF4EE; border: 1.5px solid #76A58C; border-radius: 18px; padding: 32px 28px;">
      <div style="font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; color: #183D33; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px;">RESULT</div>
      <h3 style="font-size: 20px; font-weight: 700; color: #183D33; margin-bottom: 8px;">카드 제목</h3>
      <p style="font-size: 14px; color: #183D33; line-height: 1.6;">학습 정보를 입력하세요.</p>
    </div>
  </div>
</div>
</body>
</html>
